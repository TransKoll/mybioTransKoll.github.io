<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="My bio video.">
  <title>my bio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='white'/%3E%3Cpath d='M25 19l23 13-23 13z' fill='black'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .main-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 2;
      background: #000;
      transition: opacity .28s ease, visibility .28s ease;
    }

    .intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .continue {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      width: 100%;
      padding: 24px;
      border: 0;
      background: rgba(0, 0, 0, .08);
      color: #fff;
      cursor: pointer;
    }

    .continue span {
      padding: .45em .7em;
      border-radius: .4em;
      background: rgba(0, 0, 0, .28);
      box-shadow: 0 12px 36px rgba(0, 0, 0, .2);
      font-size: clamp(1.35rem, 4vw, 2.4rem);
      font-weight: 500;
      letter-spacing: -.03em;
      text-align: center;
      text-shadow: 0 2px 16px rgba(0, 0, 0, .8);
      backdrop-filter: blur(6px);
    }

    .intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .continue:focus-visible {
      outline: 4px solid #fff;
      outline-offset: -10px;
    }

    @media (prefers-reduced-motion: reduce) {
      .intro { transition: none; }
    }
  </style>
</head>
<body>
  <video class="main-video" id="video" playsinline preload="auto">
    <source src="video.mp4" type="video/mp4">
  </video>

  <div class="intro" id="intro">
    <video class="intro-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="intro.mp4" type="video/mp4">
    </video>
    <button class="continue" id="continue" type="button" aria-label="Start video in fullscreen">
      <span>my bio. Click to continue</span>
    </button>
  </div>

  <script>
    const video = document.querySelector('#video');
    const intro = document.querySelector('#intro');
    const continueButton = document.querySelector('#continue');

    async function startVideo() {
      intro.classList.add('hidden');
      video.muted = false;
      video.volume = 1;

      const playPromise = video.play();

      try {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      } catch (_) {
        // The video still fills the browser window if fullscreen is unavailable.
      }

      try {
        await playPromise;
      } catch (_) {
        intro.classList.remove('hidden');
      }
    }

    continueButton.addEventListener('click', startVideo);
  </script>
</body>
</html>
